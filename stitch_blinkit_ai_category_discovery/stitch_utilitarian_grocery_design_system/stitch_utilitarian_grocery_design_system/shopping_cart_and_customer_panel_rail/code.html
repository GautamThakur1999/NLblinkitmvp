<style>
        body {

<body class="bg-background text-on-surface">
<!-- Shell Container -->
<div class="flex min-h-screen">

<!-- Content would live here -->
</main>

<aside class="w-[320px] h-screen sticky right-0 top-0 bg-surface-container-lowest flex flex-col border-l border-surface-variant z-50">
<!-- Top Section: Cart -->
<section class="flex flex-col h-1/2 min-h-0 border-b border-surface-variant overflow-hidden">
<div class="p-stack_loose flex items-center justify-between">
<h2 class="font-h2 text-h2 text-on-surface">My Cart</h2>
<span class="font-label-semibold text-label-semibold text-on-surface-variant bg-surface-container px-2 py-0.5 rounded-full">0 Items</span>
</div>

<div class="flex-grow flex items-center justify-center px-stack_loose" id="cart-content">
<p class="font-body text-body text-on-surface-variant text-center opacity-80">
                        Your cart is empty.
                    </p>
</div>
<!-- Footer: Checkout Button -->
<div class="p-stack_loose mt-auto">
<button class="w-full bg-secondary hover:bg-opacity-90 transition-all text-on-secondary rounded-[8px] h-12 px-4 flex items-center justify-between group cursor-pointer">
<span class="font-label-semibold text-label-semibold text-lg">₹0</span>
<div class="flex items-center gap-1">

</section>

</div>

<div class="font-label-semibold text-label-semibold text-on-surface-variant leading-tight">categories</div>
</div>
</div>
<!-- Section 1: You Buy From -->

<!-- Micro-interaction script for visual feedback -->
<script>
        document.querySelectorAll('.rounded-full').forEach(chip => {
            chip.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 100);
            });
        });
    </script>
